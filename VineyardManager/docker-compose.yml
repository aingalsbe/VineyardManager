services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vineyard
      POSTGRES_PASSWORD: vineyard
      POSTGRES_DB: vineyard_manager
    volumes:
      - vineyard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vineyard -d vineyard_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vineyard_pg:
