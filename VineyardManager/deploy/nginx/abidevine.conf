# abidevine.hipfog.com — append only. Leave hipfog.com and upward.hipfog.com blocks unchanged.
server {
    listen 80;
    server_name abidevine.hipfog.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name abidevine.hipfog.com;

    ssl_certificate     /etc/nginx/ssl/upwardscoreboard.pem;
    ssl_certificate_key /etc/nginx/ssl/upwardscoreboard.key;
    client_max_body_size 2m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $vineyard_api http://vineyard-api:3001;
        proxy_pass $vineyard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        set $vineyard_web http://vineyard-web:8080;
        proxy_pass $vineyard_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
